*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

h1,h2,h3{font-family:var(--font);color:var(--ink);text-wrap:balance}
h2{margin:0 0 16px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
h3{margin:0 0 10px;font-size:15px;line-height:1.4;font-weight:600}
b,strong{font-weight:600}
a{color:var(--brand)}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.small{font-size:12px}
.danger{color:var(--bad)}
code,.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

header .brand svg,.landing-bar .brand svg{width:26px;height:26px;color:var(--brand)}
header small,.landing-bar small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
header .toolbar{margin:0;gap:8px}
#sessionName{font-weight:500;font-size:13px;color:var(--ink)}
#roleTag.tag{background:var(--surface-2);color:var(--ink-2)}
header button{padding:6px 12px;font-size:13px}

.basis-chip{padding:4px 11px!important;font-size:12.5px!important;font-weight:500;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.basis-chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
#dataBasis{display:inline-flex}

footer .hint-fold{max-width:640px;margin:0 auto 12px;text-align:left}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.hint{background:var(--surface-2);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:13px;line-height:1.65;color:var(--ink-2)}
.hint-fold{padding:8px 14px}
.hint-fold summary{cursor:pointer;font-weight:500;list-style:none;color:var(--ink-2);font-size:12.5px}
.hint-fold summary::-webkit-details-marker{display:none}
.hint-fold summary::before{content:"";display:inline-block;width:6px;height:6px;margin:0 8px 1px 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.hint-fold[open] summary::before{transform:rotate(45deg)}
.hint-fold[open] summary{margin-bottom:6px}
.fold-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:10px 16px}
.fold-box>summary{cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink-2);list-style:none}
.fold-box>summary::-webkit-details-marker{display:none}
.fold-box>summary::before{content:"";display:inline-block;width:6px;height:6px;margin:0 9px 1px 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.fold-box[open]>summary::before{transform:rotate(45deg)}
.fold-box[open]>summary{margin-bottom:10px;color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:13px}
.stat b{display:block;margin-top:4px;font-size:24px;line-height:1.2;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.usercard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.usercard strong{display:block;margin-bottom:6px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.detail-cell{background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere;font-size:13px;color:var(--muted)}
.detail-cell b{display:block;margin-top:3px;font-size:13px;color:var(--ink);font-weight:500}
.alertrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.alertrow:last-child{border-bottom:0}
.alertrow>div{min-width:0}
.alertrow .muted{margin-top:3px;font-size:12.5px}
.alertrow b{font-family:var(--mono);font-weight:500;font-size:13px}

/* ---------- controls ---------- */
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 14px;font-weight:500;font-size:13.5px;transition:background-color .12s,border-color .12s}
button:hover{background:var(--surface-2)}
button.primary,button.active.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
button.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;min-height:36px}
textarea{width:100%}
input[type=number]{width:96px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:16px;height:16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-color:var(--focus)}
.inv-filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.inv-filterbar select,.inv-filterbar input{min-width:130px;max-width:100%}
.head-filter,.head-sort{font-size:12px!important;min-height:0!important;padding:2px 6px!important;margin-left:4px;font-weight:500}
.head-sort{border:0!important;background:transparent!important;color:var(--brand)}

/* ---------- chips ---------- */
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500;margin:2px}
.tag.gold{background:var(--warn-bg);color:var(--warn)}
.tag.red{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
#dashboard-alert-area{background:transparent;border:0;padding:0}
.tc{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap;background:var(--tbg);color:var(--tc)}
.tc::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ultra{--tc:var(--t-ultra);--tbg:var(--t-ultra-bg)}.t-frozen{--tc:var(--t-frozen);--tbg:var(--t-frozen-bg)}.t-cold{--tc:var(--t-cold);--tbg:var(--t-cold-bg)}.t-room{--tc:var(--t-room);--tbg:var(--t-room-bg)}
.sp{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.sp-bad{background:var(--bad-bg);color:var(--bad)}.sp-warn{background:var(--warn-bg);color:var(--warn)}.sp-ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- tables ---------- */
.tablewrap{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-strong);background:transparent;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td,th{font-variant-numeric:tabular-nums}
.master-toggle-row td:first-child b,#inventory td:first-child b,td>b:first-child{font-family:var(--mono);font-weight:500;font-size:12.5px}
td .muted{font-size:12px}

/* ---------- dashboard ---------- */
.dashboard-alert-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 20px}
.dashboard-alert-tab{--tabc:var(--ink-2);--tabbg:var(--surface-2);display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:0;padding:12px 16px 10px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--tabc);border-radius:10px;text-align:left;font-size:13px;color:var(--ink-2);line-height:1.4}
.dashboard-alert-tab[data-dash-tab=soon]{--tabc:var(--warn);--tabbg:var(--warn-bg)}
.dashboard-alert-tab[data-dash-tab=expired]{--tabc:var(--bad);--tabbg:var(--bad-bg)}
.dashboard-alert-tab b{font-size:26px;line-height:1.25;font-weight:600;color:var(--tabc);font-variant-numeric:tabular-nums}
.dashboard-alert-tab .dashboard-tab-more{font-size:12px;color:var(--muted);font-weight:400}
.dashboard-alert-tab:hover{background:var(--tabbg)}
.dashboard-alert-tab.active{background:var(--tabbg);border-color:var(--tabc);color:var(--ink)}
.dashboard-sort-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dashboard-sort-header h3{margin:0}
.dashboard-sort-header label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.dashboard-sort-header select{max-width:260px;min-height:32px;padding:4px 10px}
[data-dash-panel=soon]{--pc:var(--warn);--pcbg:var(--warn-bg)}
[data-dash-panel=expired]{--pc:var(--bad);--pcbg:var(--bad-bg)}
[data-dash-panel=low]{--pc:var(--ink-2);--pcbg:var(--surface-2)}
.expiry-group-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-top:10px}
.expiry-group+.expiry-group{border-top:1px solid var(--line)}
.expiry-group summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 16px;cursor:pointer;list-style:none;background:var(--surface);color:var(--ink)}
.expiry-group summary:hover{background:var(--surface-2)}
.expiry-group summary::-webkit-details-marker{display:none}
.expiry-group summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.expiry-group[open] summary::before{transform:rotate(45deg)}
.expiry-group-name{font-family:var(--mono);font-weight:500;font-size:13px}
.expiry-group-count{padding:1px 10px;border-radius:999px;background:var(--pcbg,var(--surface-2));color:var(--pc,var(--ink-2));font-size:12px;font-weight:500}
.expiry-group-date{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.expiry-group-items{padding:2px 16px 8px 38px;background:var(--surface-2);border-top:1px solid var(--line)}
.expiry-group-items .alertrow{border-bottom-color:var(--line-strong)}
.expiry-group-items .alertrow:last-child{border-bottom:0}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:64px 16px 56px;color:var(--ink-2)}
.empty svg{color:var(--muted);margin-bottom:6px}
.empty h2{margin:12px 0 6px;font-size:19px}
.empty p{max-width:44ch;margin:0 auto 18px;color:var(--muted)}

/* ---------- modal / upload ---------- */
.account-overlay{position:fixed;inset:0;z-index:120;background:rgba(8,16,13,.5);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.account-overlay.hidden{display:none!important}
.account-dialog{width:min(460px,100%);max-height:92dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
.account-dialog h2{font-size:19px;margin:0}
.account-dialog label{display:block;margin-top:14px;font-size:13px;font-weight:500;color:var(--ink-2)}
.account-dialog input:not([type=checkbox]){width:100%;margin-top:6px;min-height:42px}
.account-dialog form>button,.account-dialog button[type=submit]{width:100%;margin-top:18px;min-height:42px;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.account-dialog .signup-groups{display:grid;gap:6px;margin-top:6px}
.account-dialog .signup-groups label{display:flex;align-items:center;gap:10px;margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-weight:400;color:var(--ink)}
.account-dialog .signup-groups label:hover{background:var(--surface-2)}
/* V7.5: 회원가입 창을 PC에서 넓게 — 입력 칸 두 칸 배치, 그룹은 여러 칸 격자 */
@media (min-width:700px){#accountModal .account-dialog:has(#signupForm){width:min(920px,94vw);padding:26px 32px}
#signupForm{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
#signupForm>*{grid-column:1/-1;order:3}
#signupForm>label:nth-child(-n+5){grid-column:auto;order:1}
#signupForm>label:nth-child(3){order:2}
#signupForm #newDept{display:block;width:100%;margin-top:6px}
#signupForm .signup-groups{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));max-height:300px;overflow-y:auto;padding:10px}
#signupForm .signup-groups label{padding:7px 10px;font-size:14px}
#signupForm>button.primary{justify-self:start;min-width:160px}}
.account-dialog .signup-message,#admMsg{color:var(--bad)}
.upload-zone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);color:var(--ink-2);cursor:pointer}
.upload-zone:hover{border-color:var(--brand)}
.upload-zone input{max-width:100%}
.upload-preview{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}

input[type=file]{font:inherit;color:var(--ink-2)}
input[type=file]::file-selector-button{margin-right:10px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:500 13px var(--font);cursor:pointer}
input[type=file]::file-selector-button:hover{background:var(--surface-2)}

/* ---------- login ---------- */
#loginLanding{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#loginLanding.hidden{display:none!important}
.landing-inner{width:min(400px,100%);margin:auto}
.landing-icon{width:48px;height:48px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-bottom:18px}
.landing-icon svg{width:28px;height:28px}
.landing-inner h1{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.landing-subtitle{color:var(--muted);font-size:14px;margin-bottom:22px}
.landing-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;box-shadow:var(--shadow)}
.landing-card h2{font-size:18px;margin:0 0 4px}
.landing-card p{color:var(--muted);font-size:13px;margin:0 0 6px}
.landing-card label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin:16px 0 6px}
.landing-card input{width:100%;min-height:44px}
.landing-login{width:100%;min-height:44px;margin-top:20px;background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-size:15px}
.landing-login:hover{background:var(--brand-hover)}
.landing-links{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.landing-links button{border:0;background:transparent;color:var(--brand);font-size:13px;padding:5px 8px;border-radius:6px}
.landing-links button:hover{background:var(--surface-2)}
.landing-note{margin-top:16px;color:var(--muted);font-size:12px}
#loginMessage{color:var(--bad)!important}
#loginMessage[data-ok]{color:var(--ok)!important}

/* ---------- leftover inline colours from original templates ---------- */
[style*="#edf3f9"],[style*="#f8fafc"],[style*="#f5f8fb"]{background:var(--surface-2)!important}
[style*="background:white"],[style*="background:#fff"]{background:var(--surface)!important}
[style*="#7c8998"],[style*="#526579"],[style*="#3e5369"],[style*="#41566b"]{color:var(--muted)!important}
[style*="#b8c5d2"],[style*="#b6cfc5"]{border:1px solid var(--line-strong)!important}
[style*="#d5dee8"]{border-color:var(--line-strong)!important}

@media (max-width:760px){
 .cols{grid-template-columns:1fr}
 .shell{padding-top:16px}
 h2{font-size:20px}
 .dashboard-alert-tabs{gap:6px}
 .dashboard-alert-tab{padding:10px 10px 8px}
 .dashboard-alert-tab b{font-size:20px}
 .dashboard-alert-tab .dashboard-tab-more{display:none}
 header small{display:none}
 .expiry-group-date{margin-left:0}
 .expiry-group-items{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.paste-box{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.paste-box textarea{width:100%;box-sizing:border-box;margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font:12.5px/1.5 var(--mono,ui-monospace,monospace);resize:vertical;white-space:pre;overflow:auto}
.paste-box textarea:focus{outline:2px solid var(--accent);outline-offset:1px}

/* ===== v2.3: 로그인 ↔ 앱 톤 통일, KPI 타일 ===== */
#loginLanding{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0}
.landing-bar{flex:none;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
.landing-bar>div{display:flex;flex-direction:column;padding:2px 0}
.landing-inner{margin:auto;padding:32px 20px;width:min(420px,100%)}
.landing-icon,.landing-inner>h1,.landing-subtitle{display:none}
.landing-card{border-radius:12px;box-shadow:none;padding:28px 26px 22px}
.landing-card h2{font-size:20px;margin-bottom:6px}
.landing-note{text-align:center}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.page-head h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 16px}
.kpi,.dashboard-alert-tab{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:12px;text-align:left;color:var(--ink-2);font-size:13px;line-height:1.3;min-height:0}
.kpi{--kc:var(--muted)}.k-bad{--kc:var(--bad)}.k-warn{--kc:var(--warn)}.k-grp{--kc:var(--bad)}
.kl,.dashboard-alert-tab>span:first-child{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--ink-2)}
.kl::before,.dashboard-alert-tab>span:first-child::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--kc,var(--tabc,var(--muted)));flex:none}
.kpi b,.dashboard-alert-tab b{font-size:32px;line-height:1.1;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b small,.dashboard-alert-tab b .u{margin-left:3px;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi.zero b,.dashboard-alert-tab.zero b{color:var(--muted)}
.kpi-note{margin:-4px 0 16px;font-size:13px}
.dashboard-alert-tab{--tabc:var(--muted);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.dashboard-alert-tab[data-dash-tab=soon]{--tabc:var(--warn)}

@media (max-width:640px){.dashboard-alert-tabs{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}

.dashboard-alert-tab[data-dash-tab=empty]{--tabc:var(--ink-2)}

/* ===== 기관 로고 ===== */
.brand .kptr{height:26px;width:auto;display:block;flex:none}

:root[data-theme="dark"] .brand .kptr{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
@media (max-width:560px){.brand{flex-wrap:wrap;row-gap:4px}.brand .kptr{height:20px}.brand .brand-name{font-size:14px;flex-basis:100%}.brand .brand-sep{display:none}}

/* ===== 인쇄 화면 · 확인 창 ===== */
#printView{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.pv-bar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(20px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}

.pv-sheet{width:min(1000px,100%);margin:20px auto;padding:28px 32px;background:#fff;color:#1a1d2b;border:1px solid var(--line);border-radius:10px;font-family:Arial,"Malgun Gothic",sans-serif}
.pv-sheet h1{font-size:20px;margin:0 0 4px;color:#1a1d2b}.pv-sheet h2{font-size:15px;margin:22px 0 8px;color:#1a1d2b}
.pv-sheet table{border-collapse:collapse;width:100%;font-size:12px}
.pv-sheet th,.pv-sheet td{border:1px solid #c9ceda;padding:6px 8px;text-align:left;vertical-align:top;color:#1a1d2b;background:transparent}
.pv-sheet th{background:#eef0f6;position:static}.pv-sheet .m{color:#5b6277;font-size:12px}
.pv-sheet tbody tr:hover{background:transparent}

 <button class="landing-login" type="button" onclick="handleLandingLogin()">로그인</button></form>
 <div class="landing-links"><button type="button" onclick="openAccountDialog('signup')">담당자 회원가입</button></div>
 </div><div class="landing-note">테스트 버전 · 계정 정보는 이 브라우저에만 저장됩니다 · 실제 비밀번호를 사용하지 마세요.</div>
 </div></div>
<header><div><strong style="font-size:21px">⚗ StandardHub</strong><div><small>표준품 통합관리</small></div></div><div class="toolbar" style="margin:0"><span id="sessionName" style="font-weight:650"></span><span id="roleTag" class="tag"></span><button onclick="logoutDemo()">로그아웃</button><select id="who" style="display:none" aria-hidden="true"></select></div></header>
<div class="shell"><div class="hint"><b>테스트 버전</b> · 표준품 데이터와 계정은 이 브라우저에만 저장되며 다른 PC와 공유되지 않습니다. 실제 비밀번호는 사용하지 마세요. 공식 기준은 LIMS입니다.</div>
<div id="accountModal" class="account-overlay hidden"><div class="account-dialog"><div class="toolbar" style="justify-content:space-between"><h2 id="accountTitle" style="margin:0">로그인</h2><button onclick="closeAccountDialog()">✕ 닫기</button></div><div id="accountContent"></div></div></div><nav><button data-tab="dashboard" class="active" onclick="go('dashboard')">대시보드</button><button data-tab="inventory" onclick="go('inventory')">표준품 목록</button><button data-tab="check" onclick="go('check')">월간 재고 확인</button><button data-tab="analysis" onclick="go('analysis')">분석 결과 (BPT)</button><button data-tab="alerts" onclick="go('alerts')">재고 알림 설정</button><button data-tab="upload" onclick="go('upload')">Excel 데이터 관리</button><button data-tab="admin" onclick="go('admin')">승인 신청함</button><button data-tab="access" onclick="go('access')">내 담당 범위</button><button data-tab="signup" onclick="go('signup')">회원가입 · 로그인</button></nav>
<section id="dashboard"></section><section id="inventory" class="hidden"></section><section id="check" class="hidden"></section><section id="analysis" class="hidden"></section><section id="alerts" class="hidden"></section><section id="purchase" class="hidden"></section><section id="upload" class="hidden"></section><section id="access" class="hidden"></section><section id="admin" class="hidden"></section><section id="signup" class="hidden"></section>
</div><footer>바이오의약본부 표준품 통합관리 V12.4 · 공식 기준은 LIMS</footer>
<script>
const users=[{id:'guest',name:'방문자',status:'guest',groups:[],items:[]},{id:'admin',name:'관리자',admin:true,status:'approved',groups:[],items:[]}];
let stocks=[];
// 테스트 계정은 동일 브라우저의 로컬 저장소에만 보관됩니다.
const accountStoreKey='standardhub_v2_demo_accounts_20261030';
/* 소속 실 목록(회원가입·계정별 권한 현황). 새 실은 여기에 추가 */
const DEPTS=['바이오의약1실','바이오의약2실','바이오의약3실','시험전략기획실'];
function saveDemoAccounts(){try{localStorage.setItem(accountStoreKey,JSON.stringify(users.filter(u=>u.demoCreated)));}catch(e){console.warn('테스트 계정 저장 불가',e);}}
function restoreDemoAccounts(){try{const arr=JSON.parse(localStorage.getItem(accountStoreKey)||'[]');if(Array.isArray(arr))arr.forEach(u=>{if(u&&u.demoCreated&&typeof u.id==='string'&&!users.some(x=>x.id===u.id))users.push(u);});}catch(e){console.warn('테스트 계정 복원 불가',e);}}
/* 의뢰사 그룹: 바이오의약본부 의뢰사 표준품 마스터 관리번호(PB.XXX.*)의 XXX 코드 (NS.*는 다른 본부라 제외) — 데이터를 올리기 전에도 승인·권한에서 배정 가능 */
const CLIENT_GROUPS=['ABB','ABC','ABP','AMG','AMTS','ASP','ATZ','BAX','BAY','BKP','BMS','CAL','CSL','DKS','DSK','EIS','FER','GAL','GEN','GIL','GSK','HAN','HDT','HLM','HTL','IPS','JNJ','KKK','LEO','LUN','MDN','MDT','MEC','MEZ','MSD','NOV','NVD','ONO','ORG','PAB','PBO','PFI','PMR','PRO','QDM','SAP','SCI','SEQ','SMI','SMT','SNA','SNP','TAK','UBL','UCB','YYP'];
let groups=['BPT-냉동','BPT-냉장','BPT-실온',...CLIENT_GROUPS];let active='dashboard';const logs=[];const disposed=new Set();stocks.forEach(s=>s.initialQty=s.qty);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function user(){return users.find(u=>u.id===document.getElementById('who').value)||users[0]}
function accessible(s,u=user()){return u.admin||(u.status==='approved'&&(u.groups.includes(s.group)||u.items.includes(s.id)))}
function mine(){return stocks.filter(s=>accessible(s))}
/* 표준품 기본번호(마스터): 입고 표시를 뗀 번호. 입고 표시는 끝의 '-숫자'(예: -001)와, 마디가 4개 이상일 때 끝의 '.W숫자'(예: PB.GSK.E25.W01 → PB.GSK.E25).
   PB.ABB.W01 처럼 마디가 3개면 W01이 마스터 번호의 일부라 그대로 둠 */
function masterOf(code){let c=String(code||'').trim().replace(/-\d+$/,'');const p=c.split('.');if(p.length>=4&&/^W\d+$/i.test(p[p.length-1]))c=p.slice(0,-1).join('.');return c}
function baseCode(s){return masterOf(s.code)}
function disposalState(s){const r=detailData[s.id]||{},total=Number(r['라벨 총 수량']),used=Number(r['폐기 라벨 수량']);if(!r['라벨 총 수량']||!Number.isFinite(total)||total<=0||!Number.isFinite(used))return 'unknown';return used>=total?'done':used>0?'partial':'active'}
function activeMine(){return mine().filter(s=>disposalState(s)!=='done')}
function disposedMine(){return mine().filter(s=>disposalState(s)==='done')}
function groupMasters(list){const m=new Map();list.forEach(s=>{let k=baseCode(s);if(!m.has(k))m.set(k,[]);m.get(k).push(s)});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}))}
function expireState(s){let d=dayGap(s.exp);if(!Number.isFinite(d))return '';if(d<0)return '만료';let limit=new Date();limit.setHours(0,0,0,0);limit.setMonth(limit.getMonth()+3);return new Date(s.exp+'T00:00:00')<=limit?'3개월 이내':''}

function tag(t){return '<span class="tag">'+esc(t)+'</span>'}
function isBpt(s){return s.group.startsWith('BPT-')}
function hasGeneral(u=user()){return u.admin||u.groups.some(g=>g.startsWith('BPT-'))||u.items.some(id=>stocks.some(s=>s.id===id&&isBpt(s)))}

// V2.2 의뢰사 재고 알림: 기본 관리번호별 공통 기준, 로컬 데모 저장.
const clientAlertKey='standardhub_v21_client_alerts';
let clientAlertSearch='';
function clientThresholds(){try{const v=JSON.parse(localStorage.getItem(clientAlertKey)||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}}
function isClient(s){return !isBpt(s)}
function clientMasters(){return groupMasters(activeMine().filter(isClient))}
function clientUnitGroups(items){const groups=new Map();for(const s of items){if(expireState(s)==='만료')continue;const unit=String(s.unit||'미확인').trim()||'미확인';groups.set(unit,(groups.get(unit)||0)+Math.max(0,Number(s.qty)||0))}return [...groups.entries()].map(([unit,qty])=>({unit,qty}))}
function clientAlertOverview(){const settings=clientThresholds();const rows=clientMasters().map(([base,items])=>{const cfg=settings[base];const units=clientUnitGroups(items);const comparable=units.length===1&&units[0].unit!=='미확인';const current=comparable?units[0].qty:null;const valid=cfg&&Number.isFinite(Number(cfg.value))&&Number(cfg.value)>=0;const matched=valid&&comparable&&cfg.unit===units[0].unit;return {base,items,units,current,cfg,valid,matched,triggered:matched&&current<=Number(cfg.value),status:!valid?'미설정':!matched?'단위 확인 필요':current<=Number(cfg.value)?'재고 부족':'정상'};});return {rows,triggered:rows.filter(r=>r.triggered),unconfigured:rows.filter(r=>r.status==='미설정'),needsReview:rows.filter(r=>r.status==='단위 확인 필요')}}
function clientAlertDashboard(data){const rows=data.triggered;return `<h3>의뢰사 표준품 · 재고 부족 알림</h3><p class="muted">기본 관리번호별 공통 기준을 사용합니다. 만료·폐기 완료 재고는 사용 가능 재고에서 제외합니다.</p><p><b>기준 이하 ${rows.length}종</b> · 기준 미설정 ${data.unconfigured.length}종 · 단위 확인 필요 ${data.needsReview.length}종</p>${rows.length?`<div class="tablewrap"><table><thead><tr><th>기본 관리번호</th><th>현재 사용 가능 재고</th><th>공통 알림 기준</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.base)}</b></td><td>${esc(r.current)} ${esc(r.cfg.unit)}</td><td>${esc(r.cfg.value)} ${esc(r.cfg.unit)} 이하</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">현재 설정된 기준 이하인 의뢰사 표준품이 없습니다.</p>'}<button onclick="go('alerts')">알림 기준 관리</button>`}
function alertsPage(){if(!visibleTabs().includes('alerts'))return '<p>접근 권한이 없습니다.</p>';const data=clientAlertOverview();const rows=data.rows.filter(r=>r.base.toLowerCase().includes(clientAlertSearch.toLowerCase())||r.items.some(s=>String(s.name||'').toLowerCase().includes(clientAlertSearch.toLowerCase())));return `<h2>의뢰사 표준품 · 재고 알림 설정</h2><div class="hint">기본 관리번호별 기준 1개 · 담당자 누구나 설정·수정 · admin 승인 불필요 · 모든 공동 담당자에게 같은 기준 적용 (서버 연동 전 로컬 데모)</div><div class="grid"><div class="stat">담당 의뢰사 표준품<b>${data.rows.length}종</b></div><div class="stat">재고 부족<b>${data.triggered.length}종</b></div><div class="stat">기준 미설정<b>${data.unconfigured.length}종</b></div><div class="stat">단위 확인 필요<b>${data.needsReview.length}종</b></div></div><div class="panel"><input placeholder="기본 관리번호 또는 표준품명 검색" value="${esc(clientAlertSearch)}" oninput="clientAlertSearch=this.value;document.getElementById('clientAlertRows').innerHTML=clientAlertTable(clientAlertOverview().rows.filter(r=>r.base.toLowerCase().includes(clientAlertSearch.toLowerCase())||r.items.some(s=>String(s.name||'').toLowerCase().includes(clientAlertSearch.toLowerCase()))))" style="width:100%;max-width:430px"><div id="clientAlertRows">${clientAlertTable(rows)}</div></div><div class="panel"><h3>설정 변경 이력</h3><div id="clientAlertHistory">${clientHistoryMarkup()}</div></div>`}
function clientAlertTable(rows){return `<div class="tablewrap"><table><thead><tr><th>기본 관리번호</th><th>현재 사용 가능 재고</th><th>알림 기준</th><th>상태</th><th>설정</th></tr></thead><tbody>${rows.map(r=>{const quantity=r.units.length?r.units.map(x=>`${esc(x.qty)} ${esc(x.unit)}`).join(' / '):'사용 가능 재고 없음';return `<tr><td><b>${esc(r.base)}</b><div class="muted">${esc(r.items[0]?.name||'')}</div></td><td>${quantity}</td><td>${r.valid?esc(r.cfg.value)+' '+esc(r.cfg.unit)+' 이하':'미설정'}</td><td>${esc(r.status)}</td><td><button onclick="editClientAlert('${esc(r.base)}')">${r.valid?'수정':'설정'}</button></td></tr>`}).join('')||'<tr><td colspan="5">표시할 의뢰사 표준품이 없습니다.</td></tr>'}</tbody></table></div><div id="clientAlertEditor"></div>`}
function editClientAlert(base){const r=clientAlertOverview().rows.find(x=>x.base===base);if(!r)return;const el=document.getElementById('clientAlertEditor');if(!el)return;const units=r.units.map(x=>x.unit);const choices=[...new Set([...units,...(r.cfg?.unit?[r.cfg.unit]:[])])];el.innerHTML=`<div class="panel" style="margin-top:16px;border:1px solid #b6cfc5"><h3>${esc(base)} · 공통 알림 기준</h3><p class="muted">이 기본 관리번호를 담당하는 모든 계정에 적용됩니다.</p><label>기준 수량 <input id="clientThresholdValue" type="number" min="0" step="any" value="${r.valid?esc(r.cfg.value):''}" placeholder="예: 2"></label> <label>단위 <select id="clientThresholdUnit">${choices.map(unit=>`<option value="${esc(unit)}" ${r.cfg?.unit===unit?'selected':''}>${esc(unit)}</option>`).join('')}</select></label><p class="muted">${r.units.length!==1?'여러 단위 또는 사용 가능 재고가 없는 품목입니다. 단위 환산 없이 알림 판정을 보류합니다.':'사용 가능 재고: '+esc(r.units[0].qty)+' '+esc(r.units[0].unit)}</p><button onclick="saveClientAlert('${esc(base)}')">공통 기준 저장</button> <button onclick="clearClientAlert('${esc(base)}')">기준 미설정으로 변경</button> <button onclick="document.getElementById('clientAlertEditor').innerHTML=''">닫기</button></div>`;el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function saveClientAlert(base){const r=clientAlertOverview().rows.find(x=>x.base===base);if(!r)return;const val=document.getElementById('clientThresholdValue')?.value,unit=document.getElementById('clientThresholdUnit')?.value;if(val===''||!Number.isFinite(Number(val))||Number(val)<0||!unit){alert('0 이상의 수량과 단위를 입력해 주세요.');return}const all=clientThresholds(),before=all[base];all[base]={value:Number(val),unit,by:user().id,at:new Date().toLocaleString('ko-KR')};localStorage.setItem(clientAlertKey,JSON.stringify(all));addClientHistory(base,before,all[base]);render()}
function clearClientAlert(base){const all=clientThresholds(),before=all[base];if(!before)return;delete all[base];localStorage.setItem(clientAlertKey,JSON.stringify(all));addClientHistory(base,before,null);render()}
function addClientHistory(base,before,after){const key=clientAlertKey+'_history';let h=[];try{h=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}h.unshift({base,before:before?`${before.value} ${before.unit}`:'미설정',after:after?`${after.value} ${after.unit}`:'미설정',by:user().id,at:new Date().toLocaleString('ko-KR')});localStorage.setItem(key,JSON.stringify(h.slice(0,200)))}
function clientHistoryMarkup(){let h=[];try{h=JSON.parse(localStorage.getItem(clientAlertKey+'_history')||'[]')}catch(e){}const allowed=new Set(clientMasters().map(x=>x[0]));h=h.filter(x=>allowed.has(x.base));return h.length?`<div class="tablewrap"><table><thead><tr><th>변경 일시</th><th>관리번호</th><th>변경 전</th><th>변경 후</th><th>수정 계정</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.base)}</td><td>${esc(x.before)}</td><td>${esc(x.after)}</td><td>${esc(x.by)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">변경 이력이 없습니다.</p>'}

function visibleTabs(u=user()){if(u.status==='guest')return ['signup'];if(u.status!=='approved'&&!u.admin)return ['signup'];const tabs=['dashboard','inventory','check'];if(hasGeneral(u))tabs.push('analysis');if(u.admin||stocks.some(s=>!isBpt(s)&&accessible(s,u)))tabs.push('alerts');tabs.push('upload','access');if(u.admin)tabs.push('admin');tabs.push('signup');return tabs;}
function go(t){if(!visibleTabs().includes(t))return;active=t;render()}
function render(){let u=user();document.getElementById('sessionName').textContent='현재: '+u.name+' · '+u.id;document.getElementById('roleTag').textContent=u.status==='guest'?'로그인 전':u.admin?'관리자':u.status==='pending'?'승인 대기':'담당자';if(!visibleTabs(u).includes(active))active=u.status==='guest'||u.status==='pending'||u.status==='rejected'?'signup':'dashboard';document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===active);b.classList.toggle('hidden',!visibleTabs(u).includes(b.dataset.tab));});document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!==active));const el=document.getElementById(active);el.innerHTML=({dashboard:dash,inventory:inventory,check:check,access:access,admin:admin,signup:signup,analysis:analysis,alerts:alertsPage,purchase:purchase,upload:uploadPage}[active])();}
function dayGap(date){if(!date||!/\d{4}-\d{2}-\d{2}/.test(date))return NaN;const today=new Date();today.setHours(0,0,0,0);const d=new Date(date+'T00:00:00');return Math.ceil((d-today)/86400000)}
function threshold(s){return Math.round(s.initialQty*0.2*10)/10}
function setDisposed(){alert('폐기 완료는 Excel의 라벨 총 수량과 폐기 라벨 수량으로 자동 판정됩니다.')}
let dashboardAlertTab='soon';
function switchDashboardAlertTab(tab){
 if(!['soon','expired','low','empty','partial'].includes(tab))return;
 dashboardAlertTab=tab;
 const host=document.getElementById('dashboard-alert-area');if(!host)return;
 host.querySelectorAll('[data-dash-tab]').forEach(btn=>{const on=btn.dataset.dashTab===tab;btn.classList.toggle('active',on);btn.setAttribute('aria-selected',String(on));});
 host.querySelectorAll('[data-dash-panel]').forEach(el=>{el.hidden=el.dataset.dashPanel!==tab;});
}
let dashboardSoonSort='asc';
function setDashboardSoonSort(value){dashboardSoonSort=value==='desc'?'desc':'asc';const root=document.getElementById('dashboard');if(root)root.innerHTML=dash();}
function dash(){
 const u=user(),m=activeMine(),soon=m.filter(s=>expireState(s)==='3개월 이내'),expired=m.filter(s=>expireState(s)==='만료');
 const line=(s,desc)=>`<div class="alertrow"><div><b>${esc(s.code)}</b> <span class="muted">${esc(getInventoryValue(s,'Cat No.')||'')} · ${esc(getInventoryValue(s,'보관 장소'))}</span><div class="muted">${desc}</div></div></div>`;
 const groupedAlerts=(arr,type)=>{let grouped=groupMasters(arr);if(type==='soon')grouped=[...grouped].sort((a,b)=>{const ea=Math.min(...a[1].map(s=>dayGap(s.exp))),eb=Math.min(...b[1].map(s=>dayGap(s.exp)));return dashboardSoonSort==='desc'?eb-ea:ea-eb});if(!grouped.length)return '<p class="muted">확인할 입고번호가 없습니다.</p>';
 return `<div class="expiry-group-list">${grouped.map(([base,items])=>{const sorted=[...items].sort((a,b)=>dashboardSoonSort==='desc'&&type==='soon'?dayGap(b.exp)-dayGap(a.exp):dayGap(a.exp)-dayGap(b.exp));const earliest=type==='soon'?[...items].sort((a,b)=>dayGap(a.exp)-dayGap(b.exp))[0]:sorted[0];const desc=type==='soon'?'가장 빠른 유효기한 '+esc(earliest.exp):'유효기한 '+esc(earliest.exp);return `<details class="expiry-group"><summary><span class="expiry-group-name">${esc(base)}</span><span class="expiry-group-count">${items.length}건 확인 필요</span><span class="expiry-group-date">${desc}</span></summary><div class="expiry-group-items">${sorted.map(s=>line(s,type==='soon'?`유효기한 <strong class="expiry-date-emphasis soon">${esc(s.exp)}</strong> · <span class="expiry-days-emphasis">D-${dayGap(s.exp)}</span> · 실재고 ${esc(s.qty)} ${esc(s.unit)}`:`만료일 <strong class="expiry-date-emphasis expired">${esc(s.exp)}</strong> · 실재고 ${esc(s.qty)} ${esc(s.unit)} · 폐기 미완료`)).join('')}</div></details>`;}).join('')}</div>`;};
 const client=clientAlertOverview();const lowName=hasGeneral(u)?'재고 부족 예상 (BPT)':'재고 부족 알림';const lowCount=hasGeneral(u)?'분석 준비 중':client.triggered.length+'종';const tabs=[['soon','유효기한 3개월 이내',soon.length+'건'],['expired','유효기한 만료',expired.length+'건'],['low',lowName,lowCount]];
 return `<h2>${u.admin?'전체 표준품':'내 표준품'} 대시보드</h2>

const planning={
s1:{q:[40,50,55,65],pack:100,price:250000,lead:2,safety:1},
s2:{q:[18,22,25,27],pack:50,price:180000,lead:1,safety:1},

function metrics(s){
 const p=planning[s.id],annual=p.q.reduce((a,b)=>a+b,0),monthly=annual/12;
 const days=Math.max(0,dayGap(s.exp)),validMonths=days/30.4375;
 const usable=Math.min(s.qty,monthly*validMonths);
 const wasted=Math.max(0,s.qty-usable);
 const coverage=monthly>0?usable/monthly:Infinity;
 const reorderMonths=monthly>0?Math.max(0,coverage-p.lead-p.safety):Infinity;
 const shortage=Math.max(0,annual-usable);
 const annualPacks=Math.ceil(shortage/p.pack);
 const nextCycleNeed=Math.max(0,monthly*(p.lead+p.safety+3)-usable);
 const cyclePacks=Math.ceil(nextCycleNeed/p.pack);
 return {annual,monthly,usable,wasted,coverage,reorderMonths,shortage,annualPacks,annualCost:annualPacks*p.price,cyclePacks,cycleCost:cyclePacks*p.price,validMonths};
}

function loginDemo(){
 const modal=document.getElementById('accountModal');
 const modalOpen=!!(modal&&!modal.classList.contains('hidden'));
 const idInput=document.getElementById(modalOpen?'modalLoginId':'loginId');
 const passInput=document.getElementById(modalOpen?'modalLoginPass':'loginPass');
 const msg=document.getElementById(modalOpen?'modalLoginMessage':'loginMessage');
 const showError=t=>{if(msg){msg.textContent=t;msg.style.color='#ad4e43'}else alert(t);return false};
 if(!idInput||!passInput)return showError('로그인 입력창을 찾지 못했습니다.');
 const id=idInput.value.trim(),pw=passInput.value;
 if(!id||!pw)return showError('아이디와 비밀번호를 모두 입력해 주세요.');
 // 관리자 테스트 계정은 일반 담당자 회원가입/승인과 독립적으로 인증합니다.
 let u;
 if(id.toLowerCase()==='admin'){
   if(pw!=='admin')return showError('관리자 비밀번호가 일치하지 않습니다.');
   u=users.find(x=>x.id==='admin');
   if(!u){u={id:'admin',name:'관리자',admin:true,status:'approved',groups:[],items:[]};users.push(u)}
   u.admin=true;u.status='approved';
 }else{
   u=users.find(x=>x.id===id);
   if(!u)return showError('등록된 사번을 찾지 못했습니다.');
   if(u.status==='pending')return showError('관리자 승인 대기 중입니다.');
   if(u.status==='rejected')return showError('관리자가 반려한 계정입니다.');
   if(u.status!=='approved')return showError('승인된 담당자 계정이 아닙니다.');
   if(u.password!==pw)return showError('비밀번호가 일치하지 않습니다.');
 }
 const selector=document.getElementById('who');
 if(!selector)return showError('계정 전환 요소를 찾지 못했습니다.');
 if(!Array.from(selector.options).some(o=>o.value===u.id))selector.add(new Option(u.name,u.id));
 selector.value=u.id;
 if(selector.value!==u.id)return showError('계정 전환에 실패했습니다.');
 if(modalOpen)closeAccountDialog();
 const landing=document.getElementById('loginLanding');
 if(landing)landing.classList.add('hidden');
 active=u.admin?'admin':'dashboard';
 render();
 return false;
}

/* V6.3: 업로드 내역 — 재고 Excel(업로드 상태의 history) + 사용기록·라벨 정보(standardhub_v22_upload_log)를 종류와 함께 한 표로 */

async function unzipXlsx(buffer){const bytes=new Uint8Array(buffer),dv=new DataView(buffer),files={};let pos=bytes.length-22;while(pos>=0&&dv.getUint32(pos,true)!==0x06054b50)pos--;if(pos<0)throw Error('유효한 XLSX ZIP 파일이 아닙니다.');let n=dv.getUint16(pos+10,true),off=dv.getUint32(pos+16,true);for(let i=0;i<n;i++){if(dv.getUint32(off,true)!==0x02014b50)throw Error('ZIP 목차를 읽을 수 없습니다.');let method=dv.getUint16(off+10,true),size=dv.getUint32(off+20,true),nameLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),commentLen=dv.getUint16(off+32,true),local=dv.getUint32(off+42,true),name=new TextDecoder().decode(bytes.slice(off+46,off+46+nameLen));off+=46+nameLen+extraLen+commentLen;if(!name.startsWith('xl/')||(!name.endsWith('.xml')&&!name.endsWith('.rels')))continue;if(dv.getUint32(local,true)!==0x04034b50)continue;let dataStart=local+30+dv.getUint16(local+26,true)+dv.getUint16(local+28,true);let data=bytes.slice(dataStart,dataStart+size);if(method===8){if(typeof DecompressionStream==='undefined')throw Error('이 브라우저는 XLSX 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge를 사용해 주세요.');let stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));data=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('지원하지 않는 XLSX 압축 방식입니다.');files[name]=new TextDecoder().decode(data)}return files}

async function readExcelRows(file){if(!file||!file.name.toLowerCase().endsWith('.xlsx'))throw Error('.xlsx 파일을 선택해 주세요.');if(file.size>20*1024*1024)throw Error('테스트 버전에서는 20MB 이하 파일을 사용해 주세요.');let zip=await unzipXlsx(await file.arrayBuffer());let shared=[];if(zip['xl/sharedStrings.xml']){let d=xmlDoc(zip['xl/sharedStrings.xml']);shared=[...d.getElementsByTagName('*')].filter(x=>x.localName==='si').map(si=>[...si.getElementsByTagName('*')].filter(x=>x.localName==='t').map(x=>x.textContent).join(''))}let sheetName=Object.keys(zip).filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]))[0];if(!sheetName)throw Error('Excel 시트를 찾지 못했습니다.');let doc=xmlDoc(zip[sheetName]),raw=[];for(let row of [...doc.getElementsByTagName('*')].filter(x=>x.localName==='row')){let cols={};for(let c of xmlChildren(row,'c')){let ref=c.getAttribute('r')||'',letters=ref.match(/^[A-Z]+/i)?.[0]||'',index=0;for(let ch of letters.toUpperCase())index=index*26+ch.charCodeAt(0)-64;index--;let v=xmlChildren(c,'v')[0]?.textContent??'',type=c.getAttribute('t');if(type==='s')v=shared[Number(v)]??'';else if(type==='inlineStr')v=[...c.getElementsByTagName('*')].filter(x=>x.localName==='t').map(x=>x.textContent).join('');if(index>=0)cols[index]=v}raw.push(cols)}let headerIndex=raw.findIndex(r=>Object.values(r).some(v=>String(v).trim()==='관리 번호'));if(headerIndex<0)headerIndex=raw.findIndex(r=>Object.values(r).some(v=>String(v).trim()==='라벨 번호'));if(headerIndex<0)throw Error("'관리 번호' 열을 찾지 못했습니다. Excel 양식을 확인해 주세요.");let headers=raw[headerIndex];return raw.slice(headerIndex+1).map(r=>Object.fromEntries(Object.entries(headers).map(([i,k])=>[String(k).trim(),r[i]??'']))).filter(r=>String(r['관리 번호']||r['라벨 번호']||'').trim())}
function excelStorage(row){let t=String(row['보관 조건']||'');return /냉동|freez/i.test(t)?'냉동':/냉장|refrig/i.test(t)?'냉장':/실온|상온|room/i.test(t)?'실온':'기타'}

/* patch10: Excel 파일 없이 붙여넣기 / CSV 입력 */
(function(){
function splitRows(text,d){const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur==='')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==''))}
function parseTable(text){
  text=String(text||'').replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>/관리\s*번호|라벨\s*번호/.test(l))||text.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')?'\t':',';
  const raw=splitRows(text,d);
  let hi=raw.findIndex(r=>r.some(v=>String(v).replace(/\s/g,'')==='관리번호'));if(hi<0)hi=raw.findIndex(r=>r.some(v=>String(v).replace(/\s/g,'')==='라벨번호'));
  if(hi<0)throw Error("'관리 번호' 열을 찾지 못했습니다. Excel에서 제목(머리글) 행까지 포함해 복사해 주세요.");
  const heads=raw[hi].map(h=>{h=String(h).trim();const c=h.replace(/\s/g,'');return c==='관리번호'?'관리 번호':c==='라벨번호'?'라벨 번호':h});
  const DK='개봉 이전 유효 기한 일자';
  return raw.slice(hi+1).map(r=>{const o={};heads.forEach((k,i)=>{if(k)o[k]=String(r[i]??'').trim()});
    if(o['재고량'])o['재고량']=o['재고량'].replace(/,/g,'');
    if(o[DK]){const m=o[DK].match(/^(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/);if(m)o[DK]=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')}
    return o}).filter(r=>String(r['관리 번호']||r['라벨 번호']||'').trim());
}

const _read=window.readExcelRows;
/* NS.* 는 다른 본부 표준품이라 읽을 때 뺌 */
const notOurs=r=>/^NS\./i.test(String(r['관리 번호']||r['라벨 번호']||'').trim());
window.readExcelRows=async function(f){

/* patch14: 보관 구분을 문구 + 온도 숫자로 판정 (초저온/냉동/냉장/실온) */
(function(){
function classify(text){
  const t=String(text||'').replace(/[−–—]/g,'-').trim();if(!t)return '';
  if(/초저온|ultra|deep.?freez/i.test(t))return '초저온';
  if(/냉동|freez/i.test(t))return '냉동';
  if(/냉장|refrig|chill/i.test(t))return '냉장';
  if(/실온|상온|room|ambient|\bRT\b/i.test(t))return '실온';
  let nums=[];
  const r=t.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)/);           // 2-8 °C (양수 범위)
  if(r&&!/(^|[~\s])-\s*\d/.test(t.replace(r[0],'')))nums=[+r[1],+r[2]];
  else nums=(t.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
  if(!nums.length)return '';
  const mid=(Math.min(...nums)+Math.max(...nums))/2;
  if(mid<=-50)return '초저온';
  if(mid<-5)return '냉동';
  if(mid<=12)return '냉장';
  return '실온';
}
window.classifyStorage=classify;
window.inventoryStorage=function(s){const r=detailData[s.id]||{};const v=String(r['보관 조건']||s.storage||'').trim();return classify(v)||v||'미확인'};
window.excelStorage=function(row){return classify(row['보관 조건'])||'기타'};
window.excelGroup=function(row){const code=String(row['관리 번호']||'').trim(),m=code.match(/^PB\.([^.]+)\./i);const cat=(m?.[1]||'기타').toUpperCase();return cat==='BPT'?'BPT-'+excelStorage(row):cat};
window.normStorage=function(){
  stocks.forEach(s=>{
    const k=classify((detailData[s.id]||{})['보관 조건']||s.storage);if(!k)return;
    s.storage=k;
    if(/^BPT-/.test(s.group||'')&&s.group!=='BPT-'+k){s.group='BPT-'+k;if(!groups.includes(s.group))groups.push(s.group)}
  });
  if(!stocks.some(s=>s.group==='BPT-기타')){const i=groups.indexOf('BPT-기타');if(i>=0)groups.splice(i,1)}
};
render();
})();

/* patch15: 표준품 목록 - 기본 관리번호(PB.XXX) 필터 */
(function(){
const pre=s=>baseCode(s).replace(/\.[^.]+$/,'');
const _gm=window.groupMasters;
window.groupMasters=function(list){
  const v=active==='inventory'?(document.getElementById('masterBase')||{}).value:'';
  return _gm(v?list.filter(s=>pre(s)===v):list);
};
const _reset=window.resetMasterFilters;
window.resetMasterFilters=function(){const el=document.getElementById('masterBase');if(el)el.value='';return _reset.apply(this,arguments)};
function decorate(){
  if(active!=='inventory'||document.getElementById('masterBase'))return;
  const th=document.querySelector('#inventory table thead th');if(!th||!/기본 관리번호/.test(th.textContent))return;
  const cnt=new Map();activeMine().forEach(s=>{const k=pre(s);cnt.set(k,(cnt.get(k)||new Set()).add(baseCode(s)))});
  const keys=[...cnt.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(keys.length<2)return;
  const sel=document.createElement('select');sel.id='masterBase';sel.className='head-filter';sel.setAttribute('aria-label','기본 관리번호 필터');
  sel.innerHTML='<option value="">전체</option>'+keys.map(k=>'<option value="'+esc(k)+'">'+esc(k.replace(/^PB\./,''))+' ('+cnt.get(k).size+')</option>').join('');
  sel.onchange=()=>drawMasters();
  th.append(' ',sel);
}
const _r=window.render;window.render=function(){_r();decorate()};
})();

/* patch16: 팝업/alert/confirm이 막힌 환경에서도 동작하도록 화면 안에서 처리 */
(function(){
// 1) alert → 화면 안 알림(토스트)
let tt;
window.alert=function(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=String(msg);el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),6000);
};
// 2) confirm 대용: 화면 안 확인 창
window.askConfirm=function(o){
  closeAsk();
  const w=document.createElement('div');w.id='askLayer';w.className='account-overlay';
  w.innerHTML='<div class="account-dialog" role="alertdialog" aria-modal="true"><h3 style="margin:0 0 8px">'+esc(o.title||'확인')+'</h3><p style="margin:0 0 18px;white-space:pre-line;color:var(--ink-2)">'+esc(o.message||'')+'</p><div class="toolbar" style="justify-content:flex-end"><button id="askNo">취소</button><button id="askYes" class="'+(o.danger?'danger-btn':'primary')+'">'+esc(o.ok||'확인')+'</button></div></div>';
  document.body.appendChild(w);
  w.querySelector('#askNo').onclick=closeAsk;
  w.querySelector('#askYes').onclick=()=>{closeAsk();o.onOk&&o.onOk()};
  w.addEventListener('click',e=>{if(e.target===w)closeAsk()});
  w.querySelector('#askNo').focus();
};
function closeAsk(){const w=document.getElementById('askLayer');if(w)w.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAsk();closePrint()}});

    onOk:()=>{try{localStorage.removeItem(uploadStoreKey)}catch(e){}location.reload()}});

const CSS='body{font-family:Arial,"Malgun Gothic",sans-serif;margin:24px;color:#1a1a2b}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #c5cad8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eceff6}.m{color:#59607a;font-size:12px}.danger{color:#b42318}pre{white-space:pre-wrap;font-family:inherit;font-size:13px;border:1px solid #c5cad8;padding:10px;min-height:60px}tr.grp td{background:#f3f5fa}.w{width:90px}.c{text-align:center;width:44px}';
function closePrint(){const l=document.getElementById('printLayer');if(l)l.remove()}
window.printDoc=function(title,body){
  closePrint();
  /* 바깥 여백 0: 브라우저가 날짜·파일 이름·경로·쪽 번호(머리글·바닥글)를 찍지 못하게 함. 쪽마다 위아래 여백은 바깥 표의 머리·바닥 줄로 */

(function(){
const NASK='standardhub_v22_nas_paths';
const lj2=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};

function toTpl(p){return String(p||'').trim().replace(/^["']|["']$/g,'').split('\\').map((s,i)=>{if(i<3)return s;
  return s.replace(/(?<!\d)(20\d\d)([.\-_ ])(\d{1,2})(?!\d)/g,(m,y,sep,mo)=>'{연도}'+sep+(mo.length===1?'{월숫자}':'{월}'))
   .replace(/(?<![\d}])(20\d\d)(0[1-9]|1[0-2])(?!\d)/g,'{연도}{월}')
   .replace(/(?<![\d}])(20\d\d)(?!\d)/g,'{연도}')
   .replace(/(?<![\d}])(\d{1,2})(\s*월)/g,(m,mo,w)=>(mo.length===2&&mo[0]==='0'?'{월}':'{월숫자}')+w)}).join('\\')}
function fromTpl(t,ym){const y=ym.slice(0,4),m=ym.slice(5,7);return String(t||'').replace(/\{연도\}/g,y).replace(/\{월\}/g,m).replace(/\{월숫자\}/g,String(Number(m)))}
function getTpl(g){const A=lj2(NASK,{});return ((A[uid()]||{})[g])||''}
function setTpl(g,t){const A=lj2(NASK,{}),u=uid();A[u]=A[u]||{};if(t)A[u][g]=t;else delete A[u][g];try{localStorage.setItem(NASK,JSON.stringify(A))}catch(e){}}
window.nasToTpl=toTpl;window.nasFromTpl=fromTpl;

  const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();ok?done():alert('복사가 막혀 있습니다. 경로를 길게 눌러 직접 복사해 주세요.')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}

 const p=fromTpl(t,C.ym);

 setTpl(C.g,t);nasRender();alert('저장했습니다. 다음 달부터는 연도·월만 바뀌어 자동으로 채워집니다.')};

/* ---- PDF 만들기(라이브러리 없음) ---- */
const enc=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a};
const u16=s=>{let h='FEFF';for(const ch of s){const c=ch.charCodeAt(0);h+=c.toString(16).toUpperCase().padStart(4,'0')}return '<'+h+'>'};
/* pages: [{jpg:Uint8Array,iw,ih,W,H,fields:[{name,type:'sig'|'date',tu,rect:[x,y,w,h](pt, 위에서부터),lock}]}] */
function buildPdf(pages){
 const parts=[],offs=[];let len=0;const push=b=>{parts.push(b);len+=b.length};
 push(enc('%PDF-1.7\n%\xE2\xE3\xCF\xD3\n'));
 const obj=(n,body,stream)=>{offs[n]=len;push(enc(n+' 0 obj\n'+body+(stream?'\nstream\n':'\nendobj\n')));if(stream){push(stream);push(enc('\nendstream\nendobj\n'))}};
 let n=4;const pg=[],flds=[];const font=3;
 pages.forEach(p=>{const o={page:n++,img:n++,cnt:n++,f:p.fields.map(()=>n++)};pg.push(o)});
 const apN=n++;
 obj(1,'<< /Type /Catalog /Pages 2 0 R /AcroForm << /Fields ['+pg.flatMap(o=>o.f.map(x=>x+' 0 R')).join(' ')+'] /DA (/Helv 11 Tf 0 g) /DR << /Font << /Helv '+font+' 0 R >> >> /SigFlags 0 >> >>');
 obj(2,'<< /Type /Pages /Kids ['+pg.map(o=>o.page+' 0 R').join(' ')+'] /Count '+pg.length+' >>');
 obj(font,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 pages.forEach((p,i)=>{const o=pg[i];
  obj(o.page,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+p.W.toFixed(2)+' '+p.H.toFixed(2)+'] /Resources << /XObject << /Im1 '+o.img+' 0 R >> >> /Contents '+o.cnt+' 0 R'+(o.f.length?' /Annots ['+o.f.map(x=>x+' 0 R').join(' ')+']':'')+' >>');
  obj(o.img,'<< /Type /XObject /Subtype /Image /Width '+p.iw+' /Height '+p.ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>',p.jpg);
  const c=enc('q '+p.W.toFixed(2)+' 0 0 '+p.H.toFixed(2)+' 0 0 cm /Im1 Do Q');obj(o.cnt,'<< /Length '+c.length+' >>',c);
  p.fields.forEach((f,j)=>{const [x,y,w,h]=f.rect,R=[x,p.H-y-h,x+w,p.H-y].map(v=>v.toFixed(2)).join(' ');
   const base='<< /Type /Annot /Subtype /Widget /F 4 /P '+o.page+' 0 R /Rect ['+R+'] /T ('+f.name+') /TU '+u16(f.tu);
   if(f.type==='sig')obj(o.f[j],base+' /FT /Sig'+(f.lock?' /Lock << /Type /SigFieldLock /Action /'+f.lock[0]+' /Fields ['+f.lock[1].map(x=>'('+x+')').join(' ')+'] >>':'')+' /MK << /BC [0.17 0.42 0.85] >> >>');
   else obj(o.f[j],base+' /FT /Tx /Q 1 /MaxLen 10 /DA (/Helv 11 Tf 0 g) /MK << /BC [0.17 0.42 0.85] >> /AP << /N '+apN+' 0 R >> /AA << /K << /S /JavaScript /JS (AFDate_KeystrokeEx\\("yyyy.mm.dd"\\);) >> /F << /S /JavaScript /JS (AFDate_FormatEx\\("yyyy.mm.dd"\\);) >> >> >>')})});
 obj(apN,'<< /Type /XObject /Subtype /Form /BBox [0 0 1 1] /Length 0 >>',new Uint8Array(0));
 const xref=len;let x='xref\n0 '+n+'\n0000000000 65535 f \n';for(let i=1;i<n;i++)x+=String(offs[i]||0).padStart(10,'0')+(offs[i]!=null?' 00000 n \n':' 65535 f \n');
 push(enc(x+'trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n'));
 return new Blob(parts,{type:'application/pdf'})}

/* 화면 그대로(같은 CSS) 숨은 iframe에 그려서 쪽마다 그림으로 */
async function snap(html,wmm){
 const f=document.createElement('iframe');f.style.cssText='position:absolute;left:-10000px;top:0;width:'+wmm+'mm;height:1200px;border:0;visibility:hidden';document.body.appendChild(f);
 try{const d=f.contentDocument;d.open();d.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>body{margin:0;padding:0;background:#fff}</style></head><body>'+html+'</body></html>');d.close();
  await new Promise(r=>setTimeout(r,60));try{await d.fonts.ready}catch(e){}
  const css=[...d.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/@page[^{]*\{[^}]*\}/g,'');
  const mm=96/25.4,out=[];
  for(const el of d.querySelectorAll('.fpage,.apage')){
   const land=el.classList.contains('apage'),Wpx=(land?297:210)*mm,Hpx=(land?210:297)*mm;
   /* 서명·확인일 자리 */
   const P=el.getBoundingClientRect(),fields=[];
   el.querySelectorAll('[data-f]').forEach(s=>{const r=s.getBoundingClientRect();fields.push({name:s.dataset.f,rect:[r.left-P.left,r.top-P.top,r.width,r.height]})});
   const xml=new XMLSerializer().serializeToString(el);
   const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+Wpx+'" height="'+Hpx+'"><foreignObject x="0" y="0" width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+Wpx+'px;height:'+Hpx+'px;overflow:hidden;background:#fff"><style>'+css.replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;')+'</style>'+xml+'</div></foreignObject></svg>';
   const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
   const S=2.5,c=document.createElement('canvas');c.width=Math.round(Wpx*S);c.height=Math.round(Hpx*S);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.scale(S,S);x.drawImage(img,0,0);
   const b64=c.toDataURL('image/jpeg',.9).split(',')[1],jpg=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0));
   const k=72/96;out.push({jpg,iw:c.width,ih:c.height,W:Wpx*k,H:Hpx*k,fields:fields.map(q=>({name:q.name,rect:q.rect.map(v=>v*k)}))})}
  return out}finally{f.remove()}}

const TU={Inspector:'점검자 서명',Author:'작성자 서명',ReviewDate:'확인일 (확인자가 입력, 예: 2026.11.14)',Reviewer:'확인자(실장) 서명'};
window.signPdf=async function(){const C=window._signCtx;if(!C||!C.signHtml)return;const btn=document.getElementById('plSign');if(btn){btn.disabled=true;btn.textContent='만드는 중…'}
 try{const pages=await snap(C.signHtml,C.kind==='annex'?297:210);const first=C.kind==='annex'?'Author':'Inspector';
  pages.forEach(p=>p.fields=p.fields.map(f=>{const pad=f.name==='ReviewDate'?1.5:2,r=[f.rect[0]+pad,f.rect[1]+pad,f.rect[2]-2*pad,f.rect[3]-2*pad];
   return {name:f.name,rect:r,tu:TU[f.name]||f.name,type:f.name==='ReviewDate'?'date':'sig',lock:f.name===first?['Exclude',['ReviewDate','Reviewer']]:f.name==='Reviewer'?['Include',['ReviewDate']]:null}}));
  const blob=buildPdf(pages),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=C.title+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);window.__lastSignPdf=blob;
  alert('서명 칸이 들어간 PDF를 받았습니다. Adobe로 열어 '+(C.kind==='annex'?'작성자':'점검자')+' 칸을 눌러 서명한 뒤 NAS 폴더에 저장해 주세요.')}
 catch(e){alert('PDF를 만들지 못했습니다: '+(e&&e.message||e))}
 finally{if(btn){btn.disabled=false;btn.textContent='서명 칸 넣은 PDF 받기'}}};

/* V9.3: 서버판(앱허브) 서명 요청 — 실별 실장(확인자) 지정, [NAS에 올렸음 → 실장님께 요청], 서명 현황, 🔔 알림. 서버판(window.__SH_SERVER)에서만 보임 */
(function(){
const SV=()=>!!window.__SH_SERVER;
const LEADK='standardhub_v22_dept_leads',REQK='standardhub_v22_sign_requests';
const lj3=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv3=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('저장하지 못했습니다.');return false}};
const me=()=>{try{return user()}catch(e){return null}};
const myId=()=>{const u=me();return u?String(u.id):''};
const uName=id=>{const u=users.find(x=>String(x.id)===String(id));return u?u.name:id};
const leads=()=>lj3(LEADK,{});
const reqs=()=>lj3(REQK,[]);
const deptOf=u=>u&&u.dept||'';
const KIND={form:'정기점검',annex:'관리내역'};
const fmt=t=>{if(!t)return '';const d=new Date(t);const p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const short=p=>{const a=String(p||'').split('\\').filter(Boolean);return a.length>4?'\\\\'+a[0]+'\\…\\'+a.slice(-3).join('\\'):p};
function mine(){const id=myId(),u=me(),all=reqs();if(u&&u.admin)return all;return all.filter(r=>r.by===id||r.to===id)}

 const Y=new Date().getFullYear();let y,m,d;

 i.addEventListener('keydown',e=>{if(e.key==='Enter'){const before=i.value;if(fix(i)&&before!==i.value)i.dispatchEvent(new Event('change',{bubbles:true}))}})}
/* 원래 칸의 onchange보다 먼저 정리되게(캡처 단계) */
document.addEventListener('change',e=>{const i=e.target;if(i&&i.classList&&i.classList.contains('d-in'))fix(i)},true);
/* 버튼을 누를 때도(칸에서 벗어나지 않았어도) 알아본 날짜는 정리 */
document.addEventListener('click',e=>{if(!e.target.closest||!e.target.closest('button'))return;document.querySelectorAll('input.d-in').forEach(i=>{const n=normDate(i.value);if(n&&n!==i.value)i.value=n})},true);
const scan=r=>{if(!r||r.nodeType!==1)return;if(r.matches&&r.matches('input[type=date]:not(.d-hid)'))conv(r);r.querySelectorAll&&r.querySelectorAll('input[type=date]:not(.d-hid)').forEach(conv)};
const mo=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)scan(n)});
const go=()=>{scan(document.body);mo.observe(document.body,{childList:true,subtree:true})};if(document.body)go();else addEventListener('DOMContentLoaded',go)})();

/* V11.3: 머리 셋째 줄 왼쪽 — 확인 필요 건수(만료·임박·재고 0 폐기 미완료), 관리자는 회원가입 승인 대기, 서버판은 내게 온 서명 요청. 누르면 해당 화면으로 */
(function(){
const am=()=>{let v=3;try{v=Number(JSON.parse(localStorage.getItem('standardhub_v22_alert_months')||'3'))}catch(e){}return Number.isInteger(v)&&v>=1&&v<=24?v:3};
function counts(){let list=[];try{list=activeMine()}catch(e){}const st=s=>{try{return expireState(s)||''}catch(e){return ''}};
 return {exp:list.filter(s=>st(s)==='만료').length,soon:list.filter(s=>/이내/.test(st(s))).length,zero:list.filter(s=>Number(s.qty)===0).length}}
function draw(){const t=document.querySelector('header .toolbar');if(!t)return;let u;try{u=user()}catch(e){}
 let el=document.getElementById('hdrInfo');
 if(!u||u.status==='guest'||(u.status!=='approved'&&!u.admin)||!(typeof stocks!=='undefined'&&stocks.length)){if(el)el.hidden=true;return}
 if(!el){el=document.createElement('div');el.id='hdrInfo';t.insertBefore(el,t.firstChild);t.style.width='100%';if(t.parentElement&&t.parentElement.tagName!=='HEADER')t.parentElement.style.width='100%'}
 el.hidden=false;const c=counts(),parts=[];
 parts.push(`<button type="button" class="hi-l" onclick="hdrGo('dashboard')" title="대시보드 확인 항목으로"><b>확인 필요</b> · 만료 <b class="hi-r">${c.exp}</b>건 · ${am()}개월 이내 <b class="hi-o">${c.soon}</b>건 · 재고 0 폐기 미완료 <b>${c.zero}</b>건</button>`);
 if(u.admin){const n=users.filter(x=>x.status==='pending').length;parts.push(`<button type="button" class="hi-l" onclick="hdrGo('admin')" title="승인·권한으로">회원가입 승인 대기 <b${n?' class="hi-o"':''}>${n}</b>건</button>`)}
 if(window.__SH_SERVER&&window.signReqs){const id=String(u.id);const n=signReqs().filter(r=>r.status==='requested'&&r.to===id).length;if(n||Object.values((()=>{try{return JSON.parse(localStorage.getItem('standardhub_v22_dept_leads'))||{}}catch(e){return {}}})()).includes(id))parts.push(`<button type="button" class="hi-l" onclick="hdrGo('sign')">내게 온 서명 요청 <b${n?' class="hi-o"':''}>${n}</b>건</button>`)}
 const h=parts.join('<span class="hi-sep">|</span>');if(el.innerHTML!==h)el.innerHTML=h}
window.hdrGo=function(w){try{if(w==='sign'){go(user().admin?'overview':'dashboard');setTimeout(()=>{const p=document.getElementById('signPanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})},60)}else go(w)}catch(e){}};
const R7=window.render;window.render=function(){R7();try{draw()}catch(e){}};
addEventListener('sh-live',()=>{try{draw()}catch(e){}});
})();
</script></body></html>
